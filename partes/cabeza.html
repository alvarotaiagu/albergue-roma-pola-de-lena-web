<!-- script bloqueante: clases antes del primer pintado -->
<script>
(function (d) {
  var h = d.documentElement;
  h.classList.add('js');
  try { if (matchMedia('(prefers-reduced-motion: reduce)').matches) h.classList.add('quieto'); } catch (e) {}
  // MANDO DE MAQUETA (no viaja al cliente): solo con ?revision
  try {
    var q = new URLSearchParams(location.search);
    if (q.has('revision')) {
      h.classList.add('revision');
      if (q.get('densidad') === 'sobria') h.classList.add('densidad-sobria');
    }
  } catch (e) {}
  // red de seguridad por si main.js o cortina.js no llegan: la celosía se va sola
  window.__redCortina = setTimeout(function () {
    h.classList.add('cortina-fuera'); h.classList.remove('cortina-activa');
    var c = d.getElementById('cortina'); if (c) c.hidden = true;
  }, 6500);
})(document);
</script>
